name: GAMES202 HW1
on:
  push:
    branches: [edidada/hw1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node ci/verify-hw1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-evidence
          path: evidence/
