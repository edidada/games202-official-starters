name: GAMES202 HW5
on:
  push:
    branches: [edidada/hw5]
  workflow_dispatch:
jobs:
  denoise:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev ffmpeg
      - run: bash ci/verify-hw5.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-evidence
          path: evidence/
