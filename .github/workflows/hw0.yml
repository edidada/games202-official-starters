name: GAMES202 HW0
on:
  push:
    branches: [edidada/hw0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 pillow==12.0.0
      - run: python -m playwright install --with-deps chromium
      - name: Download pinned browser math dependency
        run: curl --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js -o hw0/lib/gl-matrix-min.js
      - run: python scripts/check_hw0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw0-webgl-results
          path: output/playwright/
