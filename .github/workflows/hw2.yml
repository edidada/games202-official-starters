name: GAMES202 HW2
on:
  push:
    branches: [edidada/hw2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prt:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev zlib1g-dev
      - run: bash ci/verify-hw2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw2-evidence
          path: evidence/
